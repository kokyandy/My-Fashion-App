spring:
  application:
    name: my-fashion-app
  
  datasource:
    url: jdbc:mysql://localhost:3306/fashion_db?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: root
    password: <your-database-password>
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

  ai:
    openai:
      api-key: <your-openai-api-key>
      model: gpt-4-vision-preview

# File Upload Configuration
file:
  upload:
    directory: ./uploads
    max-size: 10485760  # 10MB in bytes
    allowed-types: jpg,jpeg,png,gif,webp

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.fashion: DEBUG